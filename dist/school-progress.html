<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff4f83"><title>我的學校進度｜莓好學習區</title><style>
:root{--pink:#ff4f83;--navy:#071c60;--soft:#fff4f7;--line:#e5eaf4;--bg:#f7f9fd;--green:#129c76}*{box-sizing:border-box}body{margin:0;color:var(--navy);background:linear-gradient(120deg,#f4f7ff,#fff8f6);font:16px "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button,select,input{font:inherit}button,a{touch-action:manipulation}a{color:inherit;text-decoration:none}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ff88ac;outline-offset:2px}.wrap{max-width:1120px;margin:auto;padding:18px 18px 110px}.top{display:flex;align-items:center;gap:20px;background:white;border-radius:20px;padding:12px 20px;box-shadow:0 4px 25px #1622520d}.brand{font-size:24px;font-weight:900;white-space:nowrap}.brand span{margin-right:8px}.nav{margin-left:auto;display:flex;gap:6px}.nav a{padding:10px 16px;border-radius:24px;font-weight:750}.nav a[aria-current=page]{background:var(--pink);color:white}.nav .inactive{opacity:.5;cursor:default}.hero{margin:14px 0 12px;padding:34px;border-radius:22px;min-height:185px;background:linear-gradient(115deg,#e3f3ff 0%,#fff3e5 100%);position:relative;overflow:hidden}.hero h1{font-size:clamp(26px,3.5vw,43px);margin:0 0 12px}.hero p{line-height:1.75;margin:0;max-width:70%}.art{position:absolute;font-size:90px;right:50px;top:25px;filter:drop-shadow(0 10px 10px #6e89bc25)}.notice{font-size:13px;color:#667397;line-height:1.7;margin:10px 4px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.panel,.stat{background:#fff;border:1px solid #edf0f6;box-shadow:0 4px 18px #192c5b0a;border-radius:19px;padding:20px;margin:12px 0}.stat{margin:0}.stat small{display:block;color:#6c789e}.stat b{font-size:27px;display:block;color:var(--pink);margin-top:8px}.sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.sub h2{font-size:20px;margin:0}.sm{font-size:13px;color:#7280a5}.subjects{margin-top:12px}.subject{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:14px;padding:13px 2px;border-bottom:1px solid #edf1f8}.subject:last-child{border-bottom:0}.symbol{width:54px;height:54px;border-radius:13px;display:grid;place-items:center;background:var(--color);color:#fff;font-size:25px;font-weight:800}.bar{height:11px;background:#e1e6ee;border-radius:20px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pink);width:0}.secondary{border:1px solid #dce4f1;background:#fff;color:var(--navy);padding:9px 13px;border-radius:12px;font-weight:700}.pink{background:linear-gradient(120deg,#ff7998,#ff4178);color:#fff;border:0;border-radius:13px;padding:13px 20px;font-weight:800}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calendar span,.calendar strong{padding:7px 0;border-radius:40px;font-size:13px}.calendar .today{outline:2px solid var(--pink)}.calendar .marked{background:#ff86a7;color:white}.rec{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eef0f6}.rec:last-child{border:0}.rec .symbol{width:43px;height:43px;font-size:20px}.rec .detail{flex:1}.rec b{display:block}.done{color:var(--green);font-weight:700;font-size:13px}.empty{text-align:center;padding:20px;background:#f9fbff;color:#7e8aa7;border-radius:12px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.filters label{font-weight:700}.filters select{display:block;width:100%;margin-top:9px;padding:10px;border:1px solid #dce3f1;border-radius:10px;background:white}.review{text-align:center}.reviewMark{font-size:45px;color:var(--pink)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;align-items:center;justify-content:space-around;background:white;border-top:1px solid #e8ecf6;padding:8px 2px max(10px,env(safe-area-inset-bottom))}.bottom a,.bottom button{border:0;background:none;font-size:13px;color:#8a9ab9;text-align:center;min-width:60px}.bottom .current{color:var(--pink);font-weight:800}.bottom .add{background:var(--pink);border-radius:50%;color:#fff;font-size:34px;width:55px;height:55px;min-width:55px;margin-top:-26px;box-shadow:0 5px 18px #ff4f8366}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;background:#15204e91;z-index:20;display:grid;place-items:center;padding:15px}.dialog{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:22px}.steps{display:flex;justify-content:space-between;gap:8px;padding:18px 0;color:#8492b2}.steps span{font-size:12px;flex:1;text-align:center}.steps .active{color:var(--pink);font-weight:800}.num{display:block;border-radius:50%;background:#e9eef6;width:30px;height:30px;line-height:30px;margin:0 auto 7px}.active .num{background:var(--pink);color:white}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.options.five{grid-template-columns:repeat(3,1fr)}.option{min-height:120px;border:2px solid #e7eaf3;border-radius:16px;background:linear-gradient(130deg,#fff,#f9f9ff);color:var(--navy);font-weight:850;padding:14px;text-align:center}.option .emoji{display:block;font-size:34px;margin-bottom:8px}.option.selected{border-color:var(--pink);background:#fff2f6}.actions{display:flex;justify-content:space-between;margin-top:20px;gap:12px}.actions button{flex:1}.field{width:100%;border:1px solid #dce3f1;border-radius:11px;padding:12px;margin-top:8px}.toast{position:fixed;right:16px;bottom:100px;z-index:30;background:var(--navy);color:white;padding:12px 20px;border-radius:14px}.toast[hidden]{display:none}@media(max-width:650px){.wrap{padding:8px 9px 108px}.top{padding:9px 12px}.brand{font-size:19px}.nav{gap:2px}.nav a{font-size:13px;padding:9px}.hero{padding:26px 20px;min-height:162px}.hero p{max-width:75%;font-size:14px}.art{font-size:62px;right:10px;top:35px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.panel,.stat{padding:15px}.columns{grid-template-columns:1fr}.subject{grid-template-columns:45px 1fr;gap:9px}.symbol{width:44px;height:44px}.subject .secondary{grid-column:2;justify-self:start}.filters{gap:7px}.filters label{font-size:12px}.filters select{font-size:13px}.options.five{grid-template-columns:repeat(2,1fr)}.dialog{padding:16px}.brand span{margin-right:2px}}</style></head><body data-mode="school"><div id="app"></div><script>
(function(){'use strict';
var mode=document.body.dataset.mode,storage='berry-independent-progress-v1',approvalKey='berry-independent-parent-approval-v1',date=new Date(),step=1,kind='school',subject='chinese',records=[];
var subjects=[['english','英語','Aa','#956dc2','單字儲備庫'],['math','數學','π','#2f9c84','六年級互動練兵坊'],['chinese','國語','文','#d56b4e','六年級互動考卷'],['social','社會','社','#eba335','六年級互動考卷'],['science','自然','科','#40a3e9','六年級互動考卷']];
function $(s){return document.querySelector(s)}function safe(v){return String(v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[c]})}
function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function write(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('本機儲存失敗，請檢查瀏覽器設定');return false}}
function name(k){return subjects.find(function(s){return s[0]===k})||subjects[0]}
function icon(s){return '<span class="symbol" style="--color:'+s[3]+'">'+s[2]+'</span>'}
function pageNav(){return '<header class="top"><div class="brand"><span aria-hidden="true">🍓</span>莓好學習區</div><nav class="nav" aria-label="進度頁面"><span class="inactive" style="padding:10px">教材中心</span><a href="self-progress.html" '+(mode==='self'?'aria-current="page"':'')+'>自學進度</a><a href="school-progress.html" '+(mode==='school'?'aria-current="page"':'')+'>學校進度</a></nav></header>'}
function bottom(){return '<nav class="bottom" aria-label="進度頁面底部導覽"><span style="color:#acb8d1">⌂ 首頁</span><span style="color:#acb8d1">▤ 教材中心</span><button class="add" data-open aria-label="新增學習進度">+</button><a class="'+(mode==='self'?'current':'')+'" href="self-progress.html">▤<br>自學進度</a><a class="'+(mode==='school'?'current':'')+'" href="school-progress.html">▤<br>學校進度</a></nav>'}
function recent(list){if(!list.length)return '<p class="empty">目前沒有進度紀錄，請點下方「＋」手動新增。</p>';return list.slice().reverse().slice(0,12).map(function(r){var s=name(r.subject);return '<div class="rec">'+icon(s)+'<div class="detail"><b>'+s[1]+'　'+safe(r.unit)+'</b><span class="sm">'+safe(r.date)+'｜'+(r.kind==='school'?'學校進度':'評量進度')+'</span></div><span class="done">✓ 已完成</span></div>'}).join('')}
function cal(){var first=new Date(date.getFullYear(),date.getMonth(),1),last=new Date(date.getFullYear(),date.getMonth()+1,0).getDate(),today=new Date().toLocaleDateString('sv-SE'),days=['日','一','二','三','四','五','六'];var h=days.map(function(x){return '<strong>'+x+'</strong>'}).join('');for(var i=0;i<first.getDay();i++)h+='<span></span>';for(var j=1;j<=last;j++){var d=first.getFullYear()+'-'+String(first.getMonth()+1).padStart(2,'0')+'-'+String(j).padStart(2,'0'),marked=records.some(function(r){return r.date===d});h+='<span class="'+(marked?'marked ': '')+(d===today?'today':'')+'">'+j+'</span>'}return h}
function calendar(){return '<section class="panel"><div class="sub"><h2>'+(mode==='self'?'學習日曆':'學校行事曆')+'</h2><div><button class="secondary" data-month="-1" aria-label="上個月">‹</button><b id="month"> '+date.getFullYear()+' 年 '+(date.getMonth()+1)+' 月 </b><button class="secondary" data-month="1" aria-label="下個月">›</button></div></div><div class="calendar">'+cal()+'</div><p class="sm">粉色代表有手動登記紀錄。</p></section>'}
function selfPage(){var stats=[['已學教材','—'],['完成單元',records.length],['學習時數','—'],['連續學習','—']].map(function(s){return '<article class="stat"><small>'+s[0]+'</small><b>'+s[1]+'</b></article>'}).join('');var rows=subjects.map(function(s){var n=records.filter(function(r){return r.subject===s[0]}).length;return '<div class="subject">'+icon(s)+'<div><b>'+s[1]+'　'+s[4]+'</b><div class="bar"><i></i></div><div class="sm">已手動登記 '+n+' 筆｜未接教材，完成率暫不計算</div></div><button class="secondary" data-open>新增紀錄</button></div>'}).join('');return '<section class="hero"><h1>我的自學進度</h1><p>每天一點點，累積屬於自己的成長！<br>小小進步，都是大大的驚喜！</p><div class="art">📊</div></section><p class="notice">獨立開發預覽：未串接教材中心，統計不使用示範數字。</p><div class="stats">'+stats+'</div><section class="panel subjects"><div class="sub"><h2>各科自學進度</h2><button class="secondary" data-open>＋ 新增進度</button></div>'+rows+'</section><div class="columns">'+calendar()+'<section class="panel"><div class="sub"><h2>最近學習紀錄</h2><span class="sm">僅此裝置</span></div>'+recent(records)+'</section></div>'}
function schoolPage(){var selected=$('#subjectFilter')?$('#subjectFilter').value:'all',rows=selected==='all'?records:records.filter(function(r){return r.subject===selected});var options=subjects.map(function(s){return '<option value="'+s[0]+'" '+(selected===s[0]?'selected':'')+'>'+s[1]+'</option>'}).join('');var approved=read(approvalKey);return '<section class="hero"><h1>我的學校進度</h1><p>同步學校課程，掌握學習重點！<br>跟上進度，學習更輕鬆！</p><div class="art">🏫</div></section><p class="notice">獨立開發預覽：學校課表及正式家長身分尚未接線。本機登記不等於正式學籍資料。</p><section class="panel filters"><label>年級<select><option>六年級</option></select></label><label>學期<select><option>上學期</option><option>下學期</option></select></label><label>科目<select id="subjectFilter"><option value="all">全部科目</option>'+options+'</select></label></section><section class="panel"><div class="sub"><h2>本週完成率</h2><button class="pink" data-open>＋ 新增進度</button></div><div class="bar"><i></i></div><p class="sm">本機已登記 '+records.length+' 筆；尚未連接正式課表，無法計算百分比。</p></section><section class="panel"><div class="sub"><h2>本週學習紀錄</h2><span class="sm">共 '+rows.length+' 筆</span></div>'+recent(rows)+'</section><div class="columns">'+calendar()+'<section class="panel review"><h2>家長本週批閱</h2><div class="reviewMark">♛ 閱</div><p class="sm">'+(approved?'本機已標記批閱':'尚未批閱')+'</p><button class="pink" id="parentReview">'+(approved?'取消本機標記':'確認本週批閱')+'</button><p class="sm">此處僅作 UI 操作示範，尚未驗證家長身分，不構成正式簽核。</p></section></div>'}
function modal(){return '<div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sub"><h2 id="modalTitle">新增學習進度</h2><button class="secondary" data-close aria-label="關閉">✕</button></div><div class="steps"><span data-step="1"><b class="num">1</b>選擇進度類型</span><span data-step="2"><b class="num">2</b>選擇科目</span><span data-step="3"><b class="num">3</b>選擇單元</span></div><div id="stepBody"></div><div class="actions"><button class="secondary" id="previous">上一步</button><button class="pink" id="forward">下一步 ›</button></div></section></div><div class="toast" id="toast" hidden role="status"></div>'}
function showStep(){document.querySelectorAll('[data-step]').forEach(function(e){e.classList.toggle('active',Number(e.dataset.step)===step)});$('#previous').hidden=step===1;$('#forward').textContent=step===3?'✓ 登記完成':'下一步 ›';var h='';if(step===1){h='<h3>① 選擇進度類型</h3><div class="options">'+[['school','🏫','學校進度','已完成的課程單元'],['assessment','📄','評量進度','已完成的評量測驗']].map(function(s){return '<button class="option '+(kind===s[0]?'selected':'')+'" data-kind="'+s[0]+'"><span class="emoji">'+s[1]+'</span>'+s[2]+'<p class="sm">'+s[3]+'</p></button>'}).join('')+'</div>'}else if(step===2){h='<h3>② 選擇科目（五科）</h3><div class="options five">'+subjects.map(function(s){return '<button class="option '+(subject===s[0]?'selected':'')+'" data-subject="'+s[0]+'"><span class="emoji">'+s[2]+'</span>'+s[1]+'</button>'}).join('')+'</div>'}else{h='<h3>③ 選擇學習單元／課次</h3><p class="notice">'+name(subject)[1]+'｜'+(kind==='school'?'學校進度':'評量進度')+'</p><p class="empty">尚未接入各出版社教材課次，請先手動輸入課次名稱。</p><label for="unitName">課次／單元名稱</label><input id="unitName" class="field" maxlength="80" placeholder="例如：第一課" required>'}$('#stepBody').innerHTML=h}
function open(){step=1;kind='school';subject='chinese';$('#overlay').hidden=false;showStep();$('#overlay').querySelector('[data-close]').focus()}
function close(){$('#overlay').hidden=true}
function refresh(){var filter=$('#subjectFilter')?$('#subjectFilter').value:'all';$('#app').innerHTML='<div class="wrap">'+pageNav()+(mode==='school'?schoolPage():selfPage())+'</div>'+bottom()+modal();if(mode==='school'&&filter!=='all')$('#subjectFilter').value=filter}
function load(){var x=read(storage);records=Array.isArray(x)?x.filter(function(r){return r&&typeof r.unit==='string'&&subjects.some(function(s){return s[0]===r.subject})&&/^d{4}-d{2}-d{2}$/.test(r.date)}):[]}
document.addEventListener('click',function(e){var b=e.target.closest('[data-open],[data-close],[data-kind],[data-subject],[data-month],#previous,#forward,#parentReview');if(!b)return;if(b.hasAttribute('data-open')){open();return}if(b.hasAttribute('data-close')){close();return}if(b.dataset.kind){kind=b.dataset.kind;showStep();return}if(b.dataset.subject){subject=b.dataset.subject;showStep();return}if(b.dataset.month){date.setMonth(date.getMonth()+Number(b.dataset.month));refresh();return}if(b.id==='parentReview'){write(approvalKey,!read(approvalKey));refresh();return}if(b.id==='previous'){step=Math.max(1,step-1);showStep();return}if(b.id==='forward'){if(step<3){step++;showStep();return}var unit=$('#unitName').value.trim();if(!unit){$('#unitName').focus();return}records.push({id:'manual-'+Date.now(),kind:kind,subject:subject,unit:unit,date:new Date().toLocaleDateString('sv-SE')});if(write(storage,records)){refresh();$('#toast').hidden=false;$('#toast').textContent='進度已儲存在此裝置';setTimeout(function(){var t=$('#toast');if(t)t.hidden=true},2500)}return}});
document.addEventListener('change',function(e){if(e.target.id==='subjectFilter'){var selected=e.target.value;refresh();$('#subjectFilter').value=selected;var rs=selected==='all'?records:records.filter(function(r){return r.subject===selected});var x=$('.panel .rec'); /* 篩選清單依刷新後所選科目立即重建 */ var panel=$('#schoolRecords');if(panel)panel.innerHTML=recent(rs)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#overlay')&&!$('#overlay').hidden)close()});
load();refresh();
})();</script></body></html>
