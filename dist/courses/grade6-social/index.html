<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>康軒版六上社會｜莓好學習區</title>
  <link rel="manifest" href="../../manifest.webmanifest">
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../affiliate-carousel.css">
  <link rel="stylesheet" href="../../exam-engine/exam.css">
  <link rel="stylesheet" href="./learning.css">
</head>
<body class="ex-body">
  <header class="ex-topbar">
    <div class="ex-topbar-in">
      <div class="ex-brand">莓好學習區<small>國小六年級社會・單元學習與互動考卷</small></div>
      <a class="ex-back" href="../../">← 返回教材中心</a>
    </div>
  </header>
  <main class="ex-main">
    <nav class="social-learning-nav" aria-label="社會科導覽">
      <a class="ex-back" href="?version=kanghsuan">← 回單元學習</a>
    </nav>
    <div id="exam-root" aria-live="off"><p style="text-align:center;color:#786f78">載入社會科內容中…</p></div>
    <noscript><p>需要開啟 JavaScript 才能使用互動學習與考卷。</p></noscript>
  </main>
  <section class="ex-aff"><div data-affiliate-carousel data-storefront-url="https://collshp.com/sberrychang?view=storefront" data-theme="learning-center" data-limit="12"></div></section>
  <footer class="ex-footer"><p>先學習、再複習，最後進行單元測驗。考卷每次重新出題會重新抽取題目。</p><p id="curriculum-source"></p></footer>
  <script src="../../exam-engine/kit.js"></script>
  <script src="../../exam-engine/engine.js"></script>
  <script src="./config.js"></script>
  <script src="./banks/factory.js"></script>
  <script src="./learning-content.js"></script>
  <script src="./learning.js"></script>
  <script src="../../exam-engine/ui.js"></script>
  <script src="../../affiliate-carousel.config.js"></script>
  <script src="../../affiliate-carousel-v2.js"></script>
  <script>
  (function () {
    "use strict";
    var cfg = window.ExamConfig;
    var requested = new URLSearchParams(window.location.search).get("version");
    var verKey = cfg.versions[requested] ? requested : cfg.defaultVersion;
    var ver = cfg.versions[verKey];
    var src = document.getElementById("curriculum-source");
    var a = document.createElement("a");
    a.href = ver.sourceUrl; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = ver.sourceLabel;
    src.appendChild(a);
    src.appendChild(document.createTextNode("；本站題目為自編練習，非出版社課本原文。"));
    var topics = cfg.allTopics, pending = topics.length;
    function done() {
      pending -= 1;
      if (pending > 0) return;
      var engine = window.ExamEngine.create(cfg, window.ExamBank);
      var env = { engine: engine, config: cfg, root: document.getElementById("exam-root"), version: verKey };
      if (new URLSearchParams(window.location.search).get("exam") === "1") {
        window.ExamUI.start(env);
      } else {
        window.SocialLearningUI.start({
          root: env.root, config: cfg, version: verKey,
          onStartExam: function () { window.ExamUI.start(env); }
        });
      }
    }
    topics.forEach(function (topic) {
      var script = document.createElement("script");
      script.src = "./banks/bank-" + topic + ".js";
      script.onload = done;
      script.onerror = function () { script.remove(); done(); };
      document.head.appendChild(script);
    });
  })();
  </script>
</body>
</html>
