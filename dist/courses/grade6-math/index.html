        .hover\:border-emerald-300:hover, .focus\:border-emerald-600:focus { border-color: #b894a7 !important; }
        .from-emerald-600 { --tw-gradient-from: #9b7f99 var(--tw-gradient-from-position) !important; --tw-gradient-to: rgb(155 127 153 / 0) var(--tw-gradient-to-position) !important; }
        .to-teal-700 { --tw-gradient-to: #789786 var(--tw-gradient-to-position) !important; }

<body class="h-full flex flex-col text-slate-800">

            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.switchNav(0, -1)">

    <script src="./curriculum.js"></script>
    <script src="../../affiliate-carousel.config.js"></script>
    <script src="../../affiliate-carousel-v2.js"></script>
    <script>
        const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);

        // Helper for fraction formatting (clean text without LaTeX raw markers)
        const formatFrac = (n, d) => {
            if (d === 1) return `${n}`;
            return `${n}/${d}`;
        };

        const legacyMathCurriculum = [
            {
                unitId: "1",
                unitTitle: "第一單元：分數的除法",
                sections: [
                    {
                        sectionId: "1-1",
                        title: "1-1 分數除以整數與整數除以分數",
                        generators: [
                            // Q1-Q5: Calculation (分數除以整數 / 整數除以分數)
                            () => {
                                const den = [3, 4, 5, 6, 7, 8][Math.floor(Math.random() * 6)];
                                const num = den + Math.floor(Math.random() * 5) + 1;
                                const div = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                                const ansDen = den * div;
                                const g = gcd(num, ansDen);
                                const fn = num / g, fd = ansDen / g;
                                return {
                                    id: "q1_1_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 (${num}/${den}) ÷ ${div} 的值是多少？（請化為最簡分數或整數，如 3/4）`,
                                    hint: `思路：分數除以整數等於乘以該整數的倒數。\n計算式：(${num}/${den}) × (1/${div}) = ${num}/${ansDen}` + (g > 1 ? `，約分得 ${formatFrac(fn, fd)}` : ''),
                                    answer: formatFrac(fn, fd),
                                    acceptedAnswers: [formatFrac(fn, fd)]
                                };
                            },
                            () => {
                                const whole = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                                const den = [3, 4, 5, 6, 8][Math.floor(Math.random() * 5)];
                                const num = [1, 2, 3, 4, 5, 7].filter(x => x < den)[Math.floor(Math.random() * 4)] || 1;
                                const ansNum = whole * den;
                                const g = gcd(ansNum, num);
                                const fn = ansNum / g, fd = num / g;
                                return {
                                    id: "q1_1_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 ${whole} ÷ (${num}/${den}) 的值是多少？（以最簡分數或假分數表示，如 15/4）`,
                                    hint: `思路：整數除以分數等於整數乘以該分數的倒數。\n計算式：${whole} × (${den}/${num}) = (${whole} × ${den})/${num} = ${ansNum}/${num}` + (g > 1 ? `，約分得 ${formatFrac(fn, fd)}` : ''),
                                    answer: formatFrac(fn, fd),
                                    acceptedAnswers: [formatFrac(fn, fd)]
                                };
                            },
                            () => {
                                const d = [5, 6, 7, 8, 9][Math.floor(Math.random() * 5)];
                                const n = d + Math.floor(Math.random() * 4) + 1;
                                const div = [3, 4, 5][Math.floor(Math.random() * 3)];
                                const ansDen = d * div;
                                const g = gcd(n, ansDen);
                                return {
                                    id: "q1_1_" + Math.random(),
                                    type: "計算題",
                                    text: `求 (${n}/${d}) ÷ ${div} 的最簡分數答案。`,
                                    hint: `思路：將除法轉為乘以倒數。\n計算式：(${n}/${d}) × (1/${div}) = ${formatFrac(n/g, ansDen/g)}`,
                                    answer: formatFrac(n/g, ansDen/g),
                                    acceptedAnswers: [formatFrac(n/g, ansDen/g)]
                                };
                            },
                            () => {
                                const w = [4, 6, 8][Math.floor(Math.random() * 3)];
                                const d = [3, 5, 7][Math.floor(Math.random() * 3)];
                                const n = [2, 3, 4].filter(x => x < d)[0] || 2;
                                const top = w * d, bot = n;
                                const g = gcd(top, bot);
                                return {
                                    id: "q1_1_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 ${w} ÷ (${n}/${d}) 的值。`,
                                    hint: `計算式：${w} × (${d}/${n}) = ${formatFrac(top/g, bot/g)}`,
                                    answer: formatFrac(top/g, bot/g),
                                    acceptedAnswers: [formatFrac(top/g, bot/g)]
                                };
                            },
                            () => {
                                const d = 12;
                                const n = 15;
                                const div = 5;
                                const g = gcd(n, 12*5);
                                return {
                                    id: "q1_1_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 (15/12) ÷ 5 的最簡分數答案。`,
                                    hint: `計算式：(15/12) × (1/5) = 15/60 = 1/4`,
                                    answer: "1/4",
                                    acceptedAnswers: ["1/4", "3/12"]
                                };
                            },
                            // Q6-Q10: Application (應用題型)
                            () => {
                                const length = [3, 4, 5, 6][Math.floor(Math.random() * 4)];
                                const people = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
                                const top = length, bot = people;
                                const g = gcd(top, bot);
                                return {
                                    id: "q1_1_app1_" + Math.random(),
                                    type: "應用題型（平分問題）",
                                    text: `有一條長 ${length} 公尺的緞帶，平分成 ${people} 段，每段長多少公尺？`,
                                    hint: `思路：總長度 ÷ 段數 = 每段長度。\n計算式：${length} ÷ ${people} = ${formatFrac(top/g, bot/g)} 公尺。`,
                                    answer: formatFrac(top/g, bot/g),
                                    acceptedAnswers: [formatFrac(top/g, bot/g), `${formatFrac(top/g, bot/g)}公尺`]
                                };
                            },
                            () => {
                                const num = [7, 8, 9, 11][Math.floor(Math.random() * 4)];
                                const den = [4, 5, 6][Math.floor(Math.random() * 3)];
                                const boxes = [2, 3, 4][Math.floor(Math.random() * 3)];
                                const ansDen = den * boxes;
                                const g = gcd(num, ansDen);
                                return {
                                    id: "q1_1_app2_" + Math.random(),
                                    type: "應用題型（容積容量）",
                                    text: `果汁桶裡有 (${num}/${den}) 公升的果汁，平分裝在 ${boxes} 個杯子裡，每個杯子裝多少公升？`,
                                    hint: `思路：總容量 ÷ 杯子數 = 每杯容量。\n計算式：(${num}/${den}) ÷ ${boxes} = ${formatFrac(num/g, ansDen/g)} 公升。`,
                                    answer: formatFrac(num/g, ansDen/g),
                                    acceptedAnswers: [formatFrac(num/g, ansDen/g), `${formatFrac(num/g, ansDen/g)}公升`]
                                };
                            },
                            () => {
                                const totalKg = [5, 7, 9, 10][Math.floor(Math.random() * 4)];
                                const bagNum = [3, 4, 5][Math.floor(Math.random() * 3)];
                                const g = gcd(totalKg, bagNum);
                                return {
                                    id: "q1_1_app3_" + Math.random(),
                                    type: "應用題型（重量分配）",
                                    text: `農夫採收了 ${totalKg} 公斤的茶葉，平分裝成 ${bagNum} 袋，每袋重多少公斤？`,
                                    hint: `思路：總重量 ÷ 袋數 = 每袋重量。\n計算式：${totalKg} ÷ ${bagNum} = ${formatFrac(totalKg/g, bagNum/g)} 公斤。`,
                                    answer: formatFrac(totalKg/g, bagNum/g),
                                    acceptedAnswers: [formatFrac(totalKg/g, bagNum/g), `${formatFrac(totalKg/g, bagNum/g)}公斤`]
                                };
                            },
                            () => {
                                const timeMin = [15, 20, 25, 30][Math.floor(Math.random() * 4)];
                                const parts = [3, 4, 5][Math.floor(Math.random() * 3)];
                                const g = gcd(timeMin, parts);
                                return {
                                    id: "q1_1_app4_" + Math.random(),
                                    type: "應用題型（時間分割）",
                                    text: `做勞作花了 ${timeMin} 分鐘，如果把這個過程平分成 ${parts} 個步驟，每個步驟平均花多少分鐘？`,
                                    hint: `思路：總時間 ÷ 步驟數 = 每個步驟時間。\n計算式：${timeMin} ÷ ${parts} = ${timeMin/parts} 分鐘。`,
                                    answer: `${timeMin/parts}`,
                                    acceptedAnswers: [`${timeMin/parts}`, `${timeMin/parts}分鐘`]
                                };
                            },
                            () => {
                                const area = [12, 16, 18, 24][Math.floor(Math.random() * 4)];
                                const blocks = [4, 6, 8][Math.floor(Math.random() * 3)];
                                const g = gcd(area, blocks);
                                return {
                                    id: "q1_1_app5_" + Math.random(),
                                    type: "應用題型（面積均分）",
                                    text: `有一塊面積 ${area} 平方公尺的花圃，平分成 ${blocks} 塊區域種植不同的花草，每塊區域是多少平方公尺？`,
                                    hint: `思路：總面積 ÷ 區域數 = 每塊區域面積。\n計算式：${area} ÷ ${blocks} = ${area/blocks} 平方公分。`,
                                    answer: `${area/blocks}`,
                                    acceptedAnswers: [`${area/blocks}`, `${area/blocks}平方公尺`]
                                };
                            }
                        ]
                    },
                    {
                        sectionId: "1-2",
                        title: "1-2 分數除以分數",
                        generators: [
                            // Q1-Q5: Calculation
                            () => {
                                const d1 = [4, 5, 6, 8][Math.floor(Math.random() * 4)];
                                const n1 = Math.floor(Math.random() * (d1 - 1)) + 1;
                                const d2 = [3, 4, 5][Math.floor(Math.random() * 3)];
                                const n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
                                let top = n1 * d2, bot = d1 * n2;
                                const g = gcd(top, bot);
                                return {
                                    id: "q1_2_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 (${n1}/${d1}) ÷ (${n2}/${d2}) 的值是多少？`,
                                    hint: `思路：除以一個分數等於乘以它的倒數。\n計算式：(${n1}/${d1}) × (${d2}/${n2}) = ${formatFrac(top/g, bot/g)}`,
                                    answer: formatFrac(top/g, bot/g),
                                    acceptedAnswers: [formatFrac(top/g, bot/g)]
                                };
                            },
                            () => {
                                const d1 = 7, n1 = 5, d2 = 3, n2 = 2;
                                let top = 15, bot = 14;
                                return {
                                    id: "q1_2_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 (5/7) ÷ (2/3) 的最簡分數答案。`,
                                    hint: `計算式：(5/7) × (3/2) = 15/14`,
                                    answer: "15/14",
                                    acceptedAnswers: ["15/14"]
                                };
                            },
                            () => {
                                const d1 = 8, n1 = 3, d2 = 4, n2 = 1;
                                let top = 12, bot = 8;
                                const g = gcd(top, bot);
                                return {
                                    id: "q1_2_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 (3/8) ÷ (1/4) 的最簡分數答案。`,
                                    hint: `計算式：(3/8) × (4/1) = 12/8 = 3/2`,
                                    answer: "3/2",
                                    acceptedAnswers: ["3/2", "6/4", "12/8"]
                                };
                            },
                            () => {
                                const d1 = 9, n1 = 7, d2 = 3, n2 = 2;
                                let top = 21, bot = 18;
                                const g = gcd(top, bot);
                                return {
                                    id: "q1_2_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 (7/9) ÷ (2/3) 的最簡分數答案。`,
                                    hint: `計算式：(7/9) × (3/2) = 21/18 = 7/6`,
                                    answer: "7/6",
                                    acceptedAnswers: ["7/6"]
                                };
                            },
                            () => {
                                const d1 = 5, n1 = 4, d2 = 5, n2 = 2;
                                let top = 20, bot = 10;
                                return {
                                    id: "q1_2_" + Math.random(),
                                    type: "計算題",
                                    text: `計算 (4/5) ÷ (2/5) 的值。`,
                                    hint: `計算式：(4/5) × (5/2) = 20/10 = 2`,
                                    answer: "2",
                                    acceptedAnswers: ["2", "20/10"]
                                };
                            },
                            // Q6-Q10: Application
                            () => {
                                return {
                                    id: "q1_2_app1_" + Math.random(),
                                    type: "應用題型（長度包含量）",
                                    text: `有一條長 (4/5) 公尺的繩子，每 (1/5) 公尺剪成一段，可以剪成多少段？`,
                                    hint: `思路：總長度 ÷ 每段長度 = 段數。\n計算式：(4/5) ÷ (1/5) = 4 段。`,
                                    answer: "4",
                                    acceptedAnswers: ["4", "4段"]
                                };
                            },
                            () => {
                                return {
                                    id: "q1_2_app2_" + Math.random(),
                                    type: "應用題型（容量計算）",
                                    text: `水壺裡有 (7/8) 公升的水，如果用每杯 (1/4) 公升的小杯子來裝，可以裝滿幾個小杯子？還剩下多少？（填入可裝滿杯數）`,
                                    hint: `思路：(7/8) ÷ (1/4) = (7/8) × 4 = 7/2 = 3又1/2，可裝滿 3 杯。`,
                                    answer: "3",
                                    acceptedAnswers: ["3", "3杯", "7/2"]
                                };
                            },
                            () => {
                                return {
                                    id: "q1_2_app3_" + Math.random(),
                                    type: "應用題型（油漆面積）",
                                    text: `粉刷一面牆壁，每小時可以粉刷 (3/4) 平方公尺的面積，如果要粉刷 (9/4) 平方公尺，需要花多少小時？`,
                                    hint: `思路：總面積 ÷ 每小時粉刷面積 = 所需時間。\n計算式：(9/4) ÷ (3/4) = 3 小時。`,
                                    answer: "3",
                                    acceptedAnswers: ["3", "3小時"]
                                };
                            },
                            () => {
                                return {
                                    id: "q1_2_app4_" + Math.random(),
                                    type: "應用題型（速度距離）",
                                    text: `小明走路分子的速率是每分鐘走 (3/5) 公里，若要走 (9/10) 公里，需要走幾分鐘？`,
                                    hint: `思路：總距離 ÷ 分速 = 時間。\n計算式：(9/10) ÷ (3/5) = (9/10) × (5/3) = 3/2 = 1.5 分鐘。`,
                                    answer: "3/2",
                                    acceptedAnswers: ["3/2", "1.5", "1又1/2"]
                                };
                            },
                            () => {
                                return {
                                    id: "q1_2_app5_" + Math.random(),
                                    type: "應用題型（重量包裝）",
                                    text: `有 (5/6) 公斤的糖果，每 (1/6) 公斤裝成一包，總共可以裝成幾包？`,
                                    hint: `計算式：(5/6) ÷ (1/6) = 5 包。`,

                const unit = mathCurriculum[uIdx];

                let qs = [];
                unit.sections.forEach(sec => {
                    sec.generators.forEach(gen => qs.push(gen()));

                qs = qs.sort(() => 0.5 - Math.random()).slice(0, 10);

                    iconEl.className = "w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-xl";

                }

                modal.classList.remove('hidden');
            }

            closeModal() {
                document.getElementById('custom-modal').classList.add('hidden');
            }

            render() {
                const container = document.getElementById('exam-container');
                if (!container) return;

                // 1. HOME PAGE / TABLE OF CONTENTS VIEW
                if (this.currentSectionIndex === -1) {
                    let html = `
                        <div class="space-y-6 animate-fade-in">
                            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-3xl p-6 md:p-10 text-white shadow-xl relative overflow-hidden">
                                <div class="relative z-10">
                                    <span class="bg-emerald-500/40 text-emerald-100 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider mb-3 inline-block">六上＋六下完整 ${mathCurriculum.length} 單元</span>
                                    <h2 class="text-2xl md:text-4xl font-black mb-3">${versionInfo.name}國小六年級數學・互動線上考卷練兵坊</h2>
                                    <p class="text-emerald-100 text-sm md:text-base max-w-2xl leading-relaxed">
                                        每節精選 10 題（含 5 題計算題與 5 題豐富應用題型）。點選下方單元進入全真考卷畫面，自主準備白紙練習、智慧計分、詳細思路與動態變數！
                                    </p>
                                </div>
                                <div class="absolute right-0 bottom-0 opacity-15 transform translate-x-6 translate-y-6 pointer-events-none">
                                    <i class="fa-solid fa-book-open text-9xl"></i>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 gap-6">
                    `;

                    mathCurriculum.forEach((u, uIdx) => {
                        html += `
                            <div class="bg-white border-2 border-emerald-100 rounded-3xl p-6 md:p-8 shadow-sm hover:shadow-md transition">
                                <div class="flex flex-wrap justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                    <div>
                                        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">${u.semester}｜第 ${u.number} 單元</span>
                                        <h3 class="text-xl md:text-2xl font-black text-slate-800 mt-1">${u.unitTitle}</h3>
                                    </div>
                                    <button onclick="app.switchNav(${uIdx}, 0)" class="mt-2 sm:mt-0 bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow flex items-center space-x-2">
                                        <span>直接進入考卷</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </button>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        `;

                        u.sections.forEach((sec, sIdx) => {
                            html += `
                                <button onclick="app.switchNav(${uIdx}, ${sIdx})" class="text-left bg-slate-50 hover:bg-emerald-50 border-2 border-slate-200 hover:border-emerald-300 rounded-2xl p-4 transition group shadow-sm">
                                    <div class="text-xs font-bold text-emerald-600 mb-1">小節考卷 (10題)</div>
                                    <div class="text-base font-bold text-slate-800 group-hover:text-emerald-800 truncate">${sec.title}</div>
                                </button>
                            `;
                        });

                        html += `
                                <button onclick="app.switchNav(${uIdx}, ${u.sections.length})" class="text-left bg-amber-50 hover:bg-amber-100 border-2 border-amber-200 rounded-2xl p-4 transition group shadow-sm sm:col-span-2 md:col-span-1">
                                    <div class="text-xs font-bold text-amber-600 mb-1"><i class="fa-solid fa-award mr-1"></i>單元總評量 (10題)</div>
                                    <div class="text-base font-bold text-amber-900 truncate">${u.reviewTitle}</div>
                                </button>
                        `;

                        html += `</div></div>`;
                    });

                    html += `</div></div>`;
                    container.innerHTML = html;
                    return;
                }

                // 2. EXAM PAPER VIEW (SECTION OR REVIEW)
                const unit = mathCurriculum[this.currentUnitIndex];
                const isReview = this.currentSectionIndex === unit.sections.length;
                const sec = !isReview ? unit.sections[this.currentSectionIndex] : null;
                const key = !isReview ? `${this.currentUnitIndex}-${this.currentSectionIndex}` : `${this.currentUnitIndex}-review`;
                const questions = this.generatedQuestions[key] || [];

                const breadcrumbHtml = `
                    <div class="flex flex-wrap items-center justify-between pb-4 mb-6 border-b-2 border-slate-200 bg-slate-100 p-4 rounded-2xl shadow-sm">
                        <button onclick="app.switchNav(0, -1)" class="inline-flex items-center space-x-2 bg-white hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm border border-slate-300">
                            <i class="fa-solid fa-house"></i>
                            <span>點擊回到目錄首頁</span>
                        </button>
                        <div class="text-right">
                            <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">${unit.unitTitle}</span>
                        </div>
                    </div>
                `;

                if (!isReview) {
                    let html = breadcrumbHtml + `
                        <div class="bg-white border-2 border-slate-800 rounded-3xl p-6 md:p-10 shadow-xl relative max-w-4xl mx-auto w-full animate-fade-in">
                            <div class="text-center pb-6 mb-8 border-b-2 border-slate-800">
                                <div class="text-xs font-bold tracking-widest text-slate-500 uppercase mb-1">${versionInfo.name}國小六年級數學・全真模擬考卷</div>
                                <h2 class="text-2xl md:text-3xl font-black text-slate-900">${sec.title}</h2>
                                <div class="mt-3 flex flex-wrap items-center justify-center gap-4 text-sm text-slate-600">
                                    <span>班級：______ 年 ______ 班</span>
                                    <span>姓名：______________</span>
                                    <span class="bg-slate-100 px-3 py-1 rounded font-bold text-slate-800 border border-slate-300">本卷共 10 題 (5計算 + 5應用)</span>
                                </div>
                            </div>

                            <div class="flex flex-wrap justify-between items-center mb-6 bg-slate-50 p-3.5 rounded-xl border border-slate-200 gap-2">
                                <div class="text-xs font-bold text-slate-600">
                                    <i class="fa-solid fa-circle-info mr-1 text-emerald-600"></i> 請準備白紙自行計算。答案可填或不填。可點擊下方按鈕一鍵展開所有答案。
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button onclick="toggleAllAnswers()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
                                        <i class="fa-solid fa-lightbulb"></i>
                                        <span>一鍵顯示/隱藏全卷答案與思路</span>
                                    </button>
                                    <button onclick="app.refreshSection(${this.currentUnitIndex}, ${this.currentSectionIndex})" class="bg-white hover:bg-emerald-50 hover:text-emerald-600 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 border border-slate-300 shadow-sm">
                                        <i class="fa-solid fa-arrows-rotate"></i>
                                        <span>重整本節 10 題</span>
                                    </button>
                                </div>
                            </div>

                            <div class="space-y-8">
                    `;

                    questions.forEach((q, idx) => {
                        const userState = this.scores[q.id] || { userAnswer: "", isCorrect: false };
                        html += `
                            <div class="bg-white rounded-2xl p-6 border-2 border-slate-200 shadow-sm relative transition hover:border-slate-400">
                                <div class="flex justify-between items-center mb-3">
                                    <div class="flex items-center space-x-2">
                                        <span class="inline-flex items-center justify-center bg-slate-800 text-white font-black text-xs px-3 py-1 rounded-lg">
                                            第 ${idx + 1} 題
                                        </span>
                                        <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-md border border-emerald-200">
                                            ${q.type}
                                        </span>
                                    </div>
                                    <button onclick="toggleAnswer('${q.id}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 border border-emerald-300 shadow-sm">
                                        <i class="fa-solid fa-lightbulb"></i>
                                        <span>[答案與思路]</span>
                                    </button>
                                </div>

                                <div class="text-slate-900 font-bold text-lg mb-4 leading-relaxed">
                                    ${q.text}
                                </div>

                                <div id="ans-box-${q.id}" class="hidden bg-emerald-50/90 rounded-xl p-4 mb-4 border border-emerald-300 text-sm text-emerald-950 space-y-2 animate-fade-in">
                                    <div class="font-black flex items-center space-x-1.5 text-emerald-900">
                                        <i class="fa-solid fa-circle-check"></i>
                                        <span>正確答案：</span>
                                        <span class="bg-white px-2.5 py-1 rounded border border-emerald-400 font-mono text-emerald-800 text-base font-bold">${q.answer}</span>
                                    </div>
                                    <div class="text-slate-800 whitespace-pre-line leading-relaxed pt-2 border-t border-emerald-200 font-medium">
                                        <span class="font-bold text-slate-900">解題思路：</span><br>${q.hint}
                                    </div>
                                </div>

                                <div class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-100 mt-4">
                                    <div class="flex items-center space-x-3 flex-1 min-w-[280px]">
                                        <span class="text-xs font-bold text-slate-600">作答欄：</span>
                                        <input type="text" value="${userState.userAnswer}" oninput="app.updateUserAnswer('${q.id}', this.value)" placeholder="請在此填入答案（可不填）" class="flex-1 bg-slate-50 border-2 border-slate-300 focus:border-emerald-600 rounded-xl px-4 py-2.5 text-sm focus:outline-none font-bold text-slate-800">
                                        <button onclick="app.checkAnswer('${q.id}', ${JSON.stringify(q.acceptedAnswers).replace(/"/g, '&quot;')})" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow">
                                            檢查答案
                                        </button>
                                    </div>
                                    <div>
                                        ${userState.userAnswer ? (userState.isCorrect ? '<span class="inline-flex items-center text-emerald-700 font-black text-xs bg-emerald-100 px-3 py-1.5 rounded-xl border border-emerald-300 shadow-sm"><i class="fa-solid fa-check mr-1.5"></i>答對 (+10分)</span>' : '<span class="inline-flex items-center text-rose-700 font-black text-xs bg-rose-100 px-3 py-1.5 rounded-xl border border-rose-300 shadow-sm"><i class="fa-solid fa-xmark mr-1.5"></i>再算一次</span>') : '<span class="text-xs font-medium text-slate-400 italic">未填寫答案(練習中)</span>'}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    const nextSIdx = this.currentSectionIndex + 1;
                    const hasNextSection = nextSIdx < unit.sections.length;

                    html += `
                            </div>
                            
                            <div class="mt-10 pt-6 border-t-2 border-slate-200 flex flex-wrap justify-between items-center gap-4">
                                <button onclick="app.switchNav(0, -1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-3 rounded-2xl font-bold text-sm transition flex items-center space-x-2 border border-slate-300">
                                    <i class="fa-solid fa-house"></i>
                                    <span>點擊回到目錄首頁</span>
                                </button>
                                <div>
                                    ${hasNextSection ? `
                                        <button onclick="app.switchNav(${this.currentUnitIndex}, ${nextSIdx})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-2xl font-bold text-sm transition shadow-lg shadow-emerald-600/20 flex items-center space-x-2">
                                            <span>下一節：${unit.sections[nextSIdx].title}</span>
                                            <i class="fa-solid fa-arrow-right"></i>
                                        </button>
                                    ` : `
                                        <button onclick="app.switchNav(${this.currentUnitIndex}, ${unit.sections.length})" class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-2xl font-bold text-sm transition shadow-lg shadow-amber-600/20 flex items-center space-x-2">
                                            <span>前往本單元總評量測驗</span>
                                            <i class="fa-solid fa-award"></i>
                                        </button>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;

                    container.innerHTML = html;
                } else {
                    // Unit Review Exam Sheet
                    const nextUnitIdx = this.currentUnitIndex + 1;
                    const hasNextUnit = nextUnitIdx < mathCurriculum.length;

                    let html = breadcrumbHtml + `
                        <div class="bg-white border-2 border-amber-600 rounded-3xl p-6 md:p-10 shadow-xl relative max-w-4xl mx-auto w-full animate-fade-in">
                            <div class="text-center pb-6 mb-8 border-b-2 border-amber-600">
                                <span class="bg-amber-100 text-amber-800 text-xs font-black px-3 py-1 rounded-full uppercase tracking-wider mb-2 inline-block">學習成果總結算</span>
                                <h2 class="text-2xl md:text-3xl font-black text-slate-900">${unit.reviewTitle}</h2>
                                <div class="mt-3 text-sm text-slate-600">
                                    本單元總評量精選 10 題綜合考題，請獨立在白紙上計算並挑戰最高分！
                                </div>
                            </div>

                            <div class="flex flex-wrap justify-between items-center mb-6 bg-amber-50 p-3.5 rounded-xl border border-amber-200 gap-2">
                                <div class="text-xs font-bold text-amber-900">
                                    <i class="fa-solid fa-circle-exclamation mr-1 text-amber-600"></i> 總評量模式：計分方式與單元練習相同。
                                </div>
                                <div class="flex items-center space-x-2">
                                    <button onclick="toggleAllAnswers()" class="bg-amber-600 hover:bg-amber-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-sm">
                                        <i class="fa-solid fa-lightbulb"></i>
                                        <span>一鍵顯示/隱藏全卷答案與思路</span>
                                    </button>
                                    <button onclick="app.refreshReview(${this.currentUnitIndex})" class="bg-white hover:bg-amber-50 hover:text-amber-700 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 border border-amber-300 shadow-sm">
                                        <i class="fa-solid fa-arrows-rotate"></i>
                                        <span>重整總評量 10 題</span>
                                    </button>
                                </div>
                            </div>

                            <div class="space-y-8">
                    `;

                    questions.forEach((q, idx) => {
                        const userState = this.scores[q.id] || { userAnswer: "", isCorrect: false };
                        html += `
                            <div class="bg-white rounded-2xl p-6 border-2 border-amber-200 shadow-sm relative transition hover:border-amber-400">
                                <div class="flex justify-between items-center mb-3">
                                    <div class="flex items-center space-x-2">
                                        <span class="inline-flex items-center justify-center bg-amber-600 text-white font-black text-xs px-3 py-1 rounded-lg">
                                            總評量 第 ${idx + 1} 題
                                        </span>
                                        <span class="text-xs font-bold text-amber-800 bg-amber-50 px-2.5 py-1 rounded-md border border-amber-200">
                                            ${q.type}
                                        </span>
                                    </div>
                                    <button onclick="toggleAnswer('${q.id}')" class="bg-amber-50 hover:bg-amber-100 text-amber-800 px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 border border-amber-300 shadow-sm">
                                        <i class="fa-solid fa-lightbulb"></i>
                                        <span>[答案與思路]</span>
                                    </button>
                                </div>

                                <div class="text-slate-900 font-bold text-lg mb-4 leading-relaxed">
                                    ${q.text}
                                </div>

                                <div id="ans-box-${q.id}" class="hidden bg-amber-50/90 rounded-xl p-4 mb-4 border border-amber-300 text-sm text-amber-950 space-y-2 animate-fade-in">
                                    <div class="font-black flex items-center space-x-1.5 text-amber-900">
                                        <i class="fa-solid fa-circle-check"></i>
                                        <span>正確答案：</span>
                                        <span class="bg-white px-2.5 py-1 rounded border border-amber-400 font-mono text-amber-900 text-base font-bold">${q.answer}</span>
                                    </div>
                                    <div class="text-slate-800 whitespace-pre-line leading-relaxed pt-2 border-t border-amber-200 font-medium">
                                        <span class="font-bold text-slate-900">解題思路：</span><br>${q.hint}
                                    </div>
                                </div>

                                <div class="flex flex-wrap items-center justify-between gap-4 pt-4 border-t border-slate-100 mt-4">
                                    <div class="flex items-center space-x-3 flex-1 min-w-[280px]">
                                        <span class="text-xs font-bold text-slate-600">作答欄：</span>
                                        <input type="text" value="${userState.userAnswer}" oninput="app.updateUserAnswer('${q.id}', this.value)" placeholder="請在此填入答案（可不填）" class="flex-1 bg-slate-50 border-2 border-slate-300 focus:border-amber-600 rounded-xl px-4 py-2.5 text-sm focus:outline-none font-bold text-slate-800">
                                        <button onclick="app.checkAnswer('${q.id}', ${JSON.stringify(q.acceptedAnswers).replace(/"/g, '&quot;')})" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow">
                                            檢查答案
                                        </button>
                                    </div>
                                    <div>
                                        ${userState.userAnswer ? (userState.isCorrect ? '<span class="inline-flex items-center text-emerald-700 font-black text-xs bg-emerald-100 px-3 py-1.5 rounded-xl border border-emerald-300 shadow-sm"><i class="fa-solid fa-check mr-1.5"></i>答對 (+10分)</span>' : '<span class="inline-flex items-center text-rose-700 font-black text-xs bg-rose-100 px-3 py-1.5 rounded-xl border border-rose-300 shadow-sm"><i class="fa-solid fa-xmark mr-1.5"></i>再算一次</span>') : '<span class="text-xs font-medium text-slate-400 italic">未填寫答案(練習中)</span>'}
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    html += `
                            </div>

                            <div class="mt-10 pt-6 border-t-2 border-slate-200 flex flex-wrap justify-between items-center gap-4">
                                <div class="flex items-center space-x-3">
                                    <button onclick="app.switchNav(0, -1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-3 rounded-2xl font-bold text-sm transition flex items-center space-x-2 border border-slate-300">
                                        <i class="fa-solid fa-house"></i>
                                        <span>點擊回到目錄首頁</span>
                                    </button>
                                    <button onclick="app.switchNav(${this.currentUnitIndex}, ${unit.sections.length - 1})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-5 py-3 rounded-2xl font-bold text-sm transition border border-slate-300">
                                        <i class="fa-solid fa-arrow-left mr-1"></i>上一節
                                    </button>
                                </div>
                                <div>
                                    ${hasNextUnit ? `
                                        <button onclick="app.switchNav(${nextUnitIdx}, 0)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-2xl font-bold text-sm transition shadow-lg shadow-emerald-600/20 flex items-center space-x-2">
                                            <span>前往下一單元：${mathCurriculum[nextUnitIdx].unitTitle}</span>
                                            <i class="fa-solid fa-arrow-right"></i>
                                        </button>
                                    ` : `
                                        <span class="text-xs font-black text-emerald-800 bg-emerald-100 px-4 py-3 rounded-2xl border border-emerald-300 shadow-sm">
                                            <i class="fa-solid fa-flag-checkered mr-1.5 text-base"></i>您已完成所有六年級數學總複習！
                                        </span>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;

                    container.innerHTML = html;
                }
            }
        }

        // Global toggle function for answers
        function toggleAnswer(qId) {
            const box = document.getElementById(`ans-box-${qId}`);
            if (box) {
                box.classList.toggle('hidden');
            }
        }

        // Global master toggle for all answers on the current paper
        function toggleAllAnswers() {
            const boxes = document.querySelectorAll('[id^="ans-box-"]');
            if (boxes.length === 0) return;
            // Check if any box is currently hidden
            const hasHidden = Array.from(boxes).some(box => box.classList.contains('hidden'));
            boxes.forEach(box => {
                if (hasHidden) {
                    box.classList.remove('hidden');
                } else {
                    box.classList.add('hidden');
                }
            });
        }

        // Initialize application on load
        const app = new MathApp();
    </script>
</body>
</html>
