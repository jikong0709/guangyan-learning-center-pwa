<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>莓好學習區｜國小六年級數學</title>
    <link rel="manifest" href="../../manifest.webmanifest">
    <link rel="icon" href="../../icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../affiliate-carousel.css">
    <link rel="stylesheet" href="../../exam-engine/exam.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F9E0BM6HN7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-F9E0BM6HN7');
</script>
</head>
<body class="ex-body">
    <header class="ex-topbar">
        <div class="ex-topbar-in">
            <div class="ex-brand">莓好學習區<small>國小六年級數學・動態變數互動考卷</small></div>
            <a class="ex-back" href="../../">← 返回教材中心</a>
        </div>
    </header>

    <main class="ex-main">
        <div id="exam-root" aria-live="off">
            <p style="text-align:center;color:#786f78">載入題庫中…</p>
        </div>
        <noscript><p>需要開啟 JavaScript 才能使用互動考卷。</p></noscript>
    </main>

    <section class="ex-aff">
        <div data-affiliate-carousel data-storefront-url="https://collshp.com/sberrychang?view=storefront" data-theme="math-grade-6" data-limit="12"></div>
    </section>

    <footer class="ex-footer">
        <p>請準備白紙與筆自主計算，將答案填入作答欄。每次出題的數字都會重新產生。</p>
        <p id="curriculum-source"></p>
    </footer>

    <script src="../../exam-engine/kit.js"></script>
    <script src="../../exam-engine/engine.js"></script>
    <script src="./config.js"></script>
    <script src="../../exam-engine/ui.js"></script>
    <script src="../../affiliate-carousel.config.js"></script>
    <script src="../../affiliate-carousel-v2.js"></script>
    <script>
    (function () {
        "use strict";
        var cfg = window.ExamConfig;
        var requested = new URLSearchParams(window.location.search).get("version");
        var verKey = cfg.versions[requested] ? requested : cfg.defaultVersion;
        var ver = cfg.versions[verKey];
        document.title = ver.name + "國小六年級數學｜莓好學習區";
        var src = document.getElementById("curriculum-source");
        var a = document.createElement("a");
        a.href = ver.sourceUrl; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = ver.sourceLabel;
        src.appendChild(a); src.appendChild(document.createTextNode("；本站題目為自編練習，非出版社課本原文。"));

        /* 題庫以動態載入；任一檔不存在或失敗都不會讓頁面壞掉（該 topic 視為「題庫準備中」） */
        var topics = cfg.allTopics, pending = topics.length;
        function done() {
            if (--pending > 0) return;
            var engine = window.ExamEngine.create(cfg, window.ExamBank);
            window.ExamUI.start({ engine: engine, config: cfg, root: document.getElementById("exam-root"), version: verKey });
        }
        topics.forEach(function (t) {
            var s = document.createElement("script");
            s.src = "./banks/bank-" + t + ".js";
            s.onload = done;
            s.onerror = function () { s.remove(); done(); };
            document.head.appendChild(s);
        });
    })();
    </script>
</body>
</html>
