  <script>
  (function () {
    "use strict";
    var cfg = window.ExamConfig;
    var storeKey = cfg.storagePrefix + cfg.defaultVersion;
    try {
      if (!window.localStorage.getItem(storeKey)) {
        window.localStorage.setItem(storeKey, JSON.stringify({ unitIds: ["六上-1"], types: cfg.defaultTypes, level: "all", mode: "score" }));
      }
    } catch (e) { /* localStorage 不可用時，由共用 UI 使用其預設值。 */ }
    var engine = window.ExamEngine.create(cfg, window.ExamBank);
    window.ExamUI.start({ engine: engine, config: cfg, root: document.getElementById("exam-root"), version: cfg.defaultVersion });
    /* 同一底層題池的填寫版／選擇版互斥，避免同卷用不同形式洩漏答案。 */
    [["charphonetic", "charphonetic_mc"], ["vocab", "vocab_mc"]].forEach(function (pair) {
      var a = document.querySelector('input[name="type"][value="' + pair[0] + '"]');
      var b = document.querySelector('input[name="type"][value="' + pair[1] + '"]');
      if (!a || !b) return;
      function bind(self, other) {
        self.addEventListener("change", function () {
          if (self.checked && other.checked) {
            other.checked = false;
            other.dispatchEvent(new Event("change", { bubbles: true }));
          }
        });
      }
      bind(a, b); bind(b, a);
      if (a.checked && b.checked) { b.checked = false; b.dispatchEvent(new Event("change", { bubbles: true })); }
    });
  })();
  </script>
