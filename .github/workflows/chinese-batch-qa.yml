name: Chinese semester-one candidate validation
on:
  pull_request:
    paths:
      - 'dist/courses/grade6-chinese-v2/**'
      - '.github/workflows/chinese-batch-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate_guard_unit:
    name: Isolated candidate guard acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fail-closed guard in isolation
        run: node dist/courses/grade6-chinese-v2/verify-candidate-guard-unit.js
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect candidate files from independent lesson branches
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 2 12); do
            case "$n" in
              02) branch=feat/chinese-6a-02-source-20261012 ;;
              03|04|05|06|07|10|12) branch=feat/chinese-6a-${n}-batch-20261013 ;;
              08|09|11) branch=feat/chinese-6a-${n}-20261012 ;;
            esac
            git fetch origin "$branch"
            echo "LESSON_SHA $n $branch $(git rev-parse FETCH_HEAD)" | tee -a lesson-heads.txt
            for suffix in "" "-skills"; do
              file="dist/courses/grade6-chinese-v2/banks/bank-kx-6a-${n}${suffix}.js"
              git show "FETCH_HEAD:${file}" > "$file"
            done
          done
      - name: Archive exact tested lesson SHA manifest
        uses: actions/upload-artifact@v4
        with:
          name: grade6-chinese-tested-lesson-shas
          path: lesson-heads.txt
      - name: Archive integrated offline candidate page
        uses: actions/upload-artifact@v4
        with:
          name: grade6-chinese-11-lesson-candidate-site
          path: |
            dist/courses/grade6-chinese-v2/
            dist/exam-engine/
          if-no-files-found: error
      - name: Syntax check candidate diagnostic and validation scripts
        run: |
          node --check dist/courses/grade6-chinese-v2/diagnose-leak-collisions.js
          node --check dist/courses/grade6-chinese-v2/verify-batch-leaks.js
          node --check dist/courses/grade6-chinese-v2/candidate-cross-item-guard.js
          node --check dist/courses/grade6-chinese-v2/analyze-candidate-guard.js
          node --check dist/courses/grade6-chinese-v2/verify-batch-quality.js
      - name: Candidate checks and 400-paper generation per lesson
        run: node dist/courses/grade6-chinese-v2/verify-batch-candidates.js
      - name: Generate lesson 2-12 per-question candidate audit reports
        run: node dist/courses/grade6-chinese-v2/verify-batch-audits.js
      - name: Retain candidate audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade6-chinese-6a-audit-candidates
          path: dist/courses/grade6-chinese-v2/qa-reports/*.md
          if-no-files-found: error
      - name: Student-facing question quality and duplicates
        if: always()
        run: node dist/courses/grade6-chinese-v2/verify-batch-quality.js
      - name: 115-edition lesson source provenance
        if: always()
        run: node dist/courses/grade6-chinese-v2/verify-edition-provenance.js
      - name: Classify leakage evidence without relaxing original gate
        if: always()
        run: node dist/courses/grade6-chinese-v2/diagnose-leak-collisions.js
      - name: Retain leakage evidence JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade6-chinese-leakage-diagnostic
          path: dist/courses/grade6-chinese-v2/qa-reports/leak-collision-diagnostic.json
      - name: Diagnose feasibility of opt-in candidate guard
        if: always()
        run: node dist/courses/grade6-chinese-v2/analyze-candidate-guard.js
      - name: Retain candidate guard feasibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grade6-chinese-candidate-guard-feasibility
          path: dist/courses/grade6-chinese-v2/qa-reports/candidate-guard-feasibility.json
          if-no-files-found: warn
      - name: Strict 4400-paper leakage and lesson-specific ratio
        if: always()
        run: node dist/courses/grade6-chinese-v2/verify-batch-leaks.js
      - name: Baseline Chinese lesson 1
        if: always()
        run: node dist/courses/grade6-chinese-v2/verify-banks.js
      - name: Exam engine regression
        if: always()
        run: node dist/exam-engine/verify-regression.js
      - name: Exam engine self-check
        if: always()
        run: node dist/exam-engine/verify-selfcheck.js
      - name: Math unchanged regression
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for t in banks numbers notation engine explain; do
            node "dist/courses/grade6-math/verify-${t}.js"
          done
